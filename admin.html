<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama-server 管理控制台</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/themes.css">
</head>
<body class="t-dark admin-page">
<header>
  <div class="dot" id="dot"></div>
  <h1>llama-server 管理控制台</h1>
  <span style="margin-left:auto; display:flex; align-items:center; gap:10px">
    <a class="link" href="/">返回监控</a>
    <select id="theme" title="切换主题">
      <option value="dark">深色</option>
      <option value="light">浅色</option>
      <option value="glass">玻璃</option>
      <option value="terminal">终端</option>
      <option value="bento">渐变</option>
    </select>
    <button class="btn" id="btn_logout">退出</button>
  </span>
</header>

<!-- ===== 登录框 ===== -->
<div id="login_box" class="loginbox">
  <div class="login-ico">⚙️</div>
  <h2>管理员登录</h2>
  <p class="login-sub">llama-server 管理控制台</p>
  <input class="inp" id="login_pw" type="password" placeholder="管理密码" autocomplete="current-password">
  <button class="btn primary" id="btn_login">登 录</button>
  <div class="msg bad" id="login_err"></div>
</div>

<!-- ===== 管理主区 ===== -->
<div id="admin_main" style="display:none">
  <div class="cols cols2">
    <div class="col">
      <div class="tabbar">
        <button class="tab active" data-tab="tab_params">⚙️ 启动参数</button>
        <button class="tab" data-tab="tab_svc">🛠️ 服务控制</button>
        <button class="tab" data-tab="tab_pw">🔑 密码修改</button>
      </div>
      <div class="tabpanel" id="tab_svc">
      <section class="section">
        <h2><span class="sico">🛠️</span>服务控制</h2>
        <div class="defs">
          <div class="def"><span class="k">状态</span><span class="v big" id="svc_state">—</span></div>
          <div class="def"><span class="k">PID</span><span class="v big" id="svc_pid">—</span></div>
          <div class="def"><span class="k">启动时间</span><span class="v" id="svc_started">—</span></div>
          <div class="def"><span class="k">模型睡眠</span><span class="v" id="svc_sleep">—</span></div>
          <div class="def"><span class="k">进程 CPU</span><span class="v" id="h_cpu">—</span></div>
          <div class="def"><span class="k">进程内存</span><span class="v" id="h_rss">—</span></div>
          <div class="def"><span class="k">进程运行</span><span class="v" id="h_up">—</span></div>
          <div class="def"><span class="k">API 响应</span><span class="v" id="h_api">—</span></div>
        </div>
        <div class="btnrow">
          <button class="btn primary" id="btn_start">启动</button>
          <button class="btn" id="btn_restart">重启</button>
          <button class="btn danger" id="btn_stop">停止</button>
        </div>
        <div class="msg" id="svc_msg"></div>
      </section>
      <section class="section">
        <h2><span class="sico">⚡</span>快速测试</h2>
        <div class="testrow">
          <input class="inp grow" id="test_prompt" value="用一句话介绍你自己">
          <input class="inp num" id="test_max" type="number" value="64" min="1" max="1024" title="生成 token 数">
          <button class="btn primary" id="btn_test">生成</button>
        </div>
        <div class="msg" id="test_status"></div>
        <div class="logview small" id="test_out"></div>
      </section>
      </div>
      <div class="tabpanel active" id="tab_params">
      <section class="section">
        <h2><span class="sico">⚙️</span>启动参数</h2>
        <div class="fgroup">
          <h3>主程序</h3>
          <div class="frow">
            <label class="flab" title="llama-server 可执行文件路径">llama-server 主程序</label>
            <input class="inp grow" id="f_binary" readonly title="点击右侧按钮选择">
            <button class="btn" onclick="openFileBrowser('f_binary')">选择</button>
          </div>
        </div>
        <div class="fgroup">
          <h3>模型</h3>
          <div class="frow">
            <label class="flab" title="主模型文件路径（.gguf）">-m 模型</label>
            <input class="inp grow" id="f_model" readonly title="点击右侧按钮选择">
            <button class="btn" onclick="openFileBrowser('f_model')">选择</button>
            <button class="btn" onclick="clearFile('f_model')">清空</button>
          </div>
        </div>
        <div class="fgroup">
          <h3>视觉 · 多模态</h3>
          <div class="frow">
            <label class="flab" title="多模态投影器文件（视觉编码器）">--mmproj 投影器</label>
            <input class="inp grow" id="f_mmproj" readonly>
            <button class="btn" onclick="openFileBrowser('f_mmproj')">选择</button>
            <button class="btn" onclick="clearFile('f_mmproj')">清空</button>
          </div>
          <div class="frow chkrow" id="row_nommo">
            <label class="chk" title="多模态投影器不卸载到 GPU（需已设置 --mmproj）"><input type="checkbox" id="f_nommo"> --no-mmproj-offload</label>
          </div>
          <div class="fgrid">
            <div class="fcell"><label class="flab" title="每张图片编码的最小 token 数">--image-min-tokens</label><input class="inp grow" id="f_image_min_tokens" type="number"></div>
            <div class="fcell"><label class="flab" title="每张图片编码的最大 token 数">--image-max-tokens</label><input class="inp grow" id="f_image_max_tokens" type="number"></div>
          </div>
        </div>
        <div class="fgroup">
          <h3>MTP · 投机解码</h3>
          <div class="frow" id="row_draft">
            <label class="flab" title="投机解码草稿模型文件">--model-draft 草稿模型</label>
            <input class="inp grow" id="f_draft" readonly>
            <button class="btn" onclick="openFileBrowser('f_draft')">选择</button>
            <button class="btn" onclick="clearFile('f_draft')">清空</button>
          </div>
          <div class="fgrid">
            <div class="fcell span2 col">
              <label class="flab" title="投机解码类型（可多选，逗号分隔传入）">--spec-type</label>
              <div class="specchk">
                <label class="chk"><input type="checkbox" id="f_spec_none"> none</label>
                <label class="chk"><input type="checkbox" id="f_spec_draft_mtp"> draft-mtp</label>
                <label class="chk"><input type="checkbox" id="f_spec_draft_simple"> draft-simple</label>
                <label class="chk"><input type="checkbox" id="f_spec_draft_eagle3"> draft-eagle3</label>
                <label class="chk"><input type="checkbox" id="f_spec_draft_dflash"> draft-dflash</label>
                <label class="chk"><input type="checkbox" id="f_spec_draft_dspark"> draft-dspark</label>
                <label class="chk"><input type="checkbox" id="f_spec_ngram_simple"> ngram-simple</label>
                <label class="chk"><input type="checkbox" id="f_spec_ngram_map_k"> ngram-map-k</label>
                <label class="chk"><input type="checkbox" id="f_spec_ngram_map_k4v"> ngram-map-k4v</label>
                <label class="chk"><input type="checkbox" id="f_spec_ngram_mod"> ngram-mod</label>
                <label class="chk"><input type="checkbox" id="f_spec_ngram_cache"> ngram-cache</label>
              </div>
            </div>
            <div class="fcell" id="cell_dmax"><label class="flab" title="投机解码最大草稿步数">--spec-draft-n-max</label><input class="inp grow" id="f_dmax" type="number"></div>
            <div class="fcell draft-only" id="cell_dngl"><label class="flab" title="草稿模型卸载到 GPU 的层数（精确数字 / auto / all）">-ngld 草稿卸载层</label><input class="inp grow" id="f_dngl" placeholder="auto/all"></div>
            <div class="fcell draft-only" id="cell_dctk"><label class="flab" title="草稿模型 K 缓存量化类型">-ctkd 草稿KV-K</label>
              <select class="inp grow sel" id="f_dctk">
                <option value="">不设置</option><option value="q8_0">q8_0</option><option value="q4_0">q4_0</option><option value="q4_1">q4_1</option><option value="q5_0">q5_0</option><option value="q5_1">q5_1</option><option value="iq4_nl">iq4_nl</option><option value="f16">f16</option><option value="bf16">bf16</option><option value="f32">f32</option>
              </select>
            </div>
            <div class="fcell draft-only" id="cell_dctv"><label class="flab" title="草稿模型 V 缓存量化类型">-ctvd 草稿KV-V</label>
              <select class="inp grow sel" id="f_dctv">
                <option value="">不设置</option><option value="q8_0">q8_0</option><option value="q4_0">q4_0</option><option value="q4_1">q4_1</option><option value="q5_0">q5_0</option><option value="q5_1">q5_1</option><option value="iq4_nl">iq4_nl</option><option value="f16">f16</option><option value="bf16">bf16</option><option value="f32">f32</option>
              </select>
            </div>
          </div>
          <div class="fhint" id="spec_hint"></div>
        </div>
        <div class="fgroup">
          <h3>采样与推理</h3>
          <div class="fgrid">
            <div class="fcell"><label class="flab" title="采样温度（越低越确定）">--temp</label><input class="inp grow" id="f_temp" type="number" step="0.05"></div>
            <div class="fcell"><label class="flab" title="Top-K 采样：只保留概率最高的 K 个 token">--top-k</label><input class="inp grow" id="f_topk" type="number"></div>
            <div class="fcell"><label class="flab" title="Top-P 采样：累积概率阈值">--top-p</label><input class="inp grow" id="f_topp" type="number" step="0.01"></div>
            <div class="fcell"><label class="flab" title="最小概率：保留概率 ≥ min-p × 最高概率的 token（0=禁用）">--min-p</label><input class="inp grow" id="f_minp" type="number" step="0.01"></div>
            <div class="fcell"><label class="flab" title="推理（思考）模式">--reasoning</label>
              <select class="inp grow sel" id="f_reasoning">
                <option value="">不设置</option><option value="auto">auto</option><option value="on">on</option><option value="off">off</option>
              </select>
            </div>
            <div class="fcell span2"><label class="flab" title="chat 模板参数（JSON，含空格时自动加引号）">--chat-template-kwargs</label><input class="inp grow" id="f_kwargs" placeholder='{"reasoning_effort":"medium"}'></div>
            <div class="fcell"><label class="flab" title="思考强度（推理模型，如 Qwen3 / gpt-oss）">--reasoning-effort</label>
              <select class="inp grow sel" id="f_reasoning_effort">
                <option value="">不设置</option><option value="default">default</option><option value="minimal">minimal</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="思考 token 预算（-1 不限 / 0 立即结束）">--reasoning-budget</label><input class="inp grow" id="f_reasoning_budget" type="number"></div>
            <div class="fcell"><label class="flab" title="思考内容输出格式">--reasoning-format</label>
              <select class="inp grow sel" id="f_reasoning_format">
                <option value="">不设置</option><option value="auto">auto</option><option value="none">none</option><option value="deepseek">deepseek</option><option value="deepseek-legacy">deepseek-legacy</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="重复惩罚（>1 抑制重复，默认 1.0）">--repeat-penalty</label><input class="inp grow" id="f_repeat_penalty" type="number" step="0.01"></div>
            <div class="fcell"><label class="flab" title="存在惩罚（OpenAI 兼容，抑制已出现 token）">--presence-penalty</label><input class="inp grow" id="f_presence_penalty" type="number" step="0.01"></div>
            <div class="fcell"><label class="flab" title="频率惩罚（OpenAI 兼容，按出现次数抑制）">--frequency-penalty</label><input class="inp grow" id="f_frequency_penalty" type="number" step="0.01"></div>
            <div class="fcell"><label class="flab" title="惩罚回看窗口（-1 = 全部历史）">--repeat-last-n</label><input class="inp grow" id="f_repeat_last_n" type="number"></div>
            <div class="fcell"><label class="flab" title="随机种子（固定值可复现）">--seed</label><input class="inp grow" id="f_seed" type="number"></div>
          </div>
          <div class="frow">
            <label class="flab" title="从文件加载 Jinja chat 模板（--chat-template-file）">--chat-template-file 模板文件</label>
            <input class="inp grow" id="f_chat_template_file" readonly title="点击右侧按钮选择">
            <button class="btn" onclick="openFileBrowser('f_chat_template_file')">选择</button>
            <button class="btn" onclick="clearFile('f_chat_template_file')">清空</button>
          </div>
        </div>
        <div class="fgroup">
          <h3>性能与内存</h3>
          <div class="fgrid">
            <div class="fcell"><label class="flab" title="上下文长度（最大 token 数）">-c 上下文</label><input class="inp grow" id="f_c" type="number"></div>
            <div class="fcell"><label class="flab" title="卸载到 GPU 的层数（精确数字 / auto / all）">-ngl 卸载层</label><input class="inp grow" id="f_ngl" placeholder="auto/all"></div>
            <div class="fcell"><label class="flab" title="CPU 线程数">-t 线程</label><input class="inp grow" id="f_t" type="number"></div>
            <div class="fcell"><label class="flab" title="并行请求槽位数">-np 槽位</label><input class="inp grow" id="f_np" type="number"></div>
            <div class="fcell"><label class="flab" title="批处理大小">-b 批</label><input class="inp grow" id="f_b" type="number"></div>
            <div class="fcell"><label class="flab" title="微批大小">-ub 微批</label><input class="inp grow" id="f_ub" type="number"></div>
            <div class="fcell"><label class="flab" title="Flash Attention 开关">-fa 注意力</label>
              <select class="inp grow sel" id="f_fa">
                <option value="">不设置</option><option value="on">on</option><option value="off">off</option><option value="auto">auto</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="K 缓存量化类型">-ctk KV-K</label>
              <select class="inp grow sel" id="f_ctk">
                <option value="">不设置</option><option value="q8_0">q8_0</option><option value="q4_0">q4_0</option><option value="q4_1">q4_1</option><option value="q5_0">q5_0</option><option value="q5_1">q5_1</option><option value="iq4_nl">iq4_nl</option><option value="f16">f16</option><option value="bf16">bf16</option><option value="f32">f32</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="V 缓存量化类型">-ctv KV-V</label>
              <select class="inp grow sel" id="f_ctv">
                <option value="">不设置</option><option value="q8_0">q8_0</option><option value="q4_0">q4_0</option><option value="q4_1">q4_1</option><option value="q5_0">q5_0</option><option value="q5_1">q5_1</option><option value="iq4_nl">iq4_nl</option><option value="f16">f16</option><option value="bf16">bf16</option><option value="f32">f32</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="server prompt cache 上限（MiB，-1=不限，0=禁用；禁用后 --cache-idle-slots 也失效）">--cache-ram</label><input class="inp grow" id="f_cram" type="number"></div>
            <div class="fcell"><label class="flab" title="模型加载方式">--load-mode</label>
              <select class="inp grow sel" id="f_load">
                <option value="">不设置</option><option value="auto">auto</option><option value="none">none</option><option value="mmap">mmap</option><option value="mlock">mlock</option><option value="mmap+mlock">mmap+mlock</option><option value="dio">dio</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="KV 缓存复用 chunk 数（社区共识 256，降低首 token 延迟）">--cache-reuse</label><input class="inp grow" id="f_cache_reuse" type="number"></div>
            <div class="fcell"><label class="flab" title="批处理线程数（通常小于 -t）">--threads-batch</label><input class="inp grow" id="f_threads_batch" type="number"></div>
            <div class="fcell"><label class="flab" title="主 GPU 索引（多卡时）">--main-gpu</label><input class="inp grow" id="f_main_gpu" type="number"></div>
            <div class="fcell"><label class="flab" title="MoE 专家留在 CPU 的层数">--n-cpu-moe</label><input class="inp grow" id="f_n_cpu_moe" type="number"></div>
            <div class="fcell"><label class="flab" title="自动适配显存（on/off）">--fit</label>
              <select class="inp grow sel" id="f_fit">
                <option value="">不设置</option><option value="on">on</option><option value="off">off</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="每卡保留显存余量（MiB）">--fit-target</label><input class="inp grow" id="f_fit_target" placeholder="MiB"></div>
            <div class="fcell"><label class="flab" title="NUMA 策略（多路 CPU 时）">--numa</label>
              <select class="inp grow sel" id="f_numa">
                <option value="">不设置</option><option value="distribute">distribute</option><option value="isolate">isolate</option><option value="numactl">numactl</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="RoPE 位置编码扩展方式（长上下文）">--rope-scaling</label>
              <select class="inp grow sel" id="f_rope_scaling">
                <option value="">不设置</option><option value="none">none</option><option value="linear">linear</option><option value="yarn">yarn</option>
              </select>
            </div>
            <div class="fcell"><label class="flab" title="RoPE 扩展倍数（配合 --rope-scaling）">--rope-scale</label><input class="inp grow" id="f_rope_scale" type="number" step="0.5"></div>
          </div>
          <div class="frow chkrow">
            <label class="chk" title="关闭 KV 缓存卸载到 GPU（省显存）"><input type="checkbox" id="f_no_kv_offload"> --no-kv-offload</label>
            <label class="chk" title="无限生成上下文滑动（超出上下文时丢弃最早 token）"><input type="checkbox" id="f_context_shift"> --context-shift</label>
            <label class="chk" title="绕过 host 缓冲区（不预留 CPU 内存，允许系统分配更多内存）"><input type="checkbox" id="f_nohost"> --no-host</label>
          </div>
          <div class="fhint" id="batch_hint"></div>
        </div>
        <div class="fgroup">
          <h3>多 GPU</h3>
          <div class="fgrid">
            <div class="fcell span2 col">
              <label class="flab" title="指定使用的 GPU 设备（可多选，逗号分隔传入）">--device 设备</label>
              <div class="specchk" id="devchk"></div>
            </div>
            <div class="fcell" id="cell_split"><label class="flab" title="多 GPU 切分模式（≥2 设备时生效）">--split-mode</label>
              <select class="inp grow sel" id="f_split">
                <option value="">不设置</option><option value="tensor">tensor</option><option value="layer">layer</option><option value="row">row</option><option value="none">none</option>
              </select>
            </div>
            <div class="fcell" id="cell_ts"><label class="flab" title="各 GPU 负载分配比例（数量需等于设备数）">--tensor-split</label><input class="inp grow" id="f_ts" placeholder="1,1"></div>
          </div>
          <div class="fhint" id="gpu_hint"></div>
        </div>
        <div class="fgroup">
          <h3>网络与其他</h3>
          <div class="fgrid">
            <div class="fcell"><label class="flab" title="监听地址">--host</label><input class="inp grow" id="f_host" placeholder="0.0.0.0"></div>
            <div class="fcell"><label class="flab" title="服务监听端口">--port 端口</label><input class="inp grow" id="f_port" type="number"></div>
            <div class="fcell"><label class="flab" title="模型别名（/v1/models 中显示）">--alias</label><input class="inp grow" id="f_alias" placeholder="模型别名"></div>
            <div class="fcell"><label class="flab" title="API 密钥认证（对外暴露时建议设置，可逗号分隔多个）">--api-key</label><input class="inp grow" id="f_api_key" type="password" placeholder="API 密钥" autocomplete="off"></div>
            <div class="fcell"><label class="flab" title="HTTP 请求处理线程数">--threads-http</label><input class="inp grow" id="f_threads_http" type="number"></div>
            <div class="fcell"><label class="flab" title="读/写超时（秒）">--timeout</label><input class="inp grow" id="f_timeout" type="number"></div>
            <div class="fcell"><label class="flab" title="空闲 N 秒后卸载模型省显存">--sleep-idle-seconds</label><input class="inp grow" id="f_sleep_idle_seconds" type="number"></div>
          </div>
          <div class="frow chkrow">
            <label class="chk" title="启用 /metrics 指标端点"><input type="checkbox" id="f_metrics"> --metrics</label>
            <label class="chk" title="关闭内置 Web UI（减少攻击面）"><input type="checkbox" id="f_no_webui"> --no-webui</label>
          </div>
        </div>
        <div class="fgroup">
          <h3>自定义命令（其他参数）</h3>
          <textarea class="ta" id="f_custom" rows="3" spellcheck="false" placeholder="其他未列出的启动参数，原样追加到命令末尾"></textarea>
        </div>
        <div class="cmd-bar">
          <span class="cmd-bar-label">命令预览</span>
          <button class="btn sm" id="btn_cmd_copy" title="复制完整启动命令">复制</button>
        </div>
        <div class="cmd" id="cmd_preview"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("admin_token");
let es = null;

/* ---------- 主题 ---------- */
const savedTheme = localStorage.getItem("theme") || "dark";
document.body.className = "t-" + savedTheme + " admin-page";
$("theme").value = savedTheme;
$("theme").onchange = e => {
  localStorage.setItem("theme", e.target.value);
  document.body.className = "t-" + e.target.value + " admin-page";
};

/* ---------- 左列标签页 ---------- */
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.id === name));
}
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => switchTab(t.dataset.tab); });

/* ---------- API ---------- */
function api(path, body) {
  const opt = { method: body ? "POST" : "GET",
                headers: { "X-Admin-Token": token || "" } };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(async r => {
    if (r.status === 401) { showLogin(); throw new Error("未登录"); }
    return r.json();
  });
}

function showLogin() {
  token = null;
  localStorage.removeItem("admin_token");
  $("login_box").style.display = "";
  $("admin_main").style.display = "none";
  if (es) { es.close(); es = null; }
}

function showMain() {
  $("login_box").style.display = "none";
  $("admin_main").style.display = "";
  refreshService();
  refreshHealth();
  loadCmd();
  loadTail();
  openStream();
  refreshErrors();
}

$("btn_login").onclick = async () => {
  $("login_err").textContent = "";
  try {
    const r = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("login_pw").value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "登录失败");
    token = j.token;
    localStorage.setItem("admin_token", token);
    $("login_pw").value = "";
    showMain();
  } catch (e) { $("login_err").textContent = e.message; }
};
$("login_pw").onkeydown = e => { if (e.key === "Enter") $("btn_login").click(); };
$("btn_logout").onclick = showLogin;

/* ---------- 服务控制 ---------- */
async function refreshService() {
  if (!token) return;
  try {
    const j = await api("/api/admin/service");
    $("svc_state").textContent = j.active + (j.sub ? " / " + j.sub : "");
    $("svc_state").className = "v big " + (j.active === "active" ? "ok" : "bad");
    $("svc_pid").textContent = j.pid || "—";
    $("svc_started").textContent = j.started || "—";
    $("dot").className = "dot" + (j.active === "active" ? "" : " down");
  } catch (e) {}
  try {
    const s = await (await fetch("/api/status")).json();
    const sl = s.llama && s.llama.props && s.llama.props.sleeping;
    $("svc_sleep").textContent = sl ? "是" : "否";
    $("svc_sleep").className = "v " + (sl ? "warn" : "ok");
  } catch (e) {}
}

async function doAction(action, label) {
  if (!confirm("确定要" + label + " llama-server 吗？")) return;
  $("svc_msg").textContent = label + "中…";
  try {
    const j = await api("/api/admin/service", { action });
    $("svc_msg").textContent = j.ok ? label + "成功" : (j.error || label + "失败");
    $("svc_msg").className = "msg " + (j.ok ? "ok" : "bad");
    refreshService();
  } catch (e) { $("svc_msg").textContent = e.message; $("svc_msg").className = "msg bad"; }
}
$("btn_start").onclick = () => doAction("start", "启动");
$("btn_restart").onclick = () => doAction("restart", "重启");
$("btn_stop").onclick = () => doAction("stop", "停止");

/* ---------- 服务健康 ---------- */
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + " 天 " + h + " 时";
  if (h) return h + " 时 " + m + " 分";
  return m + " 分";
}
async function refreshHealth() {
  if (!token) return;
  try {
    const j = await api("/api/admin/health");
    const p = j.proc;
    $("h_cpu").textContent = p ? p.cpu + "%" : "—";
    $("h_rss").textContent = p ? (p.rss_mb / 1024).toFixed(1) + " GB" : "—";
    $("h_up").textContent = p ? fmtUptime(p.uptime) : "—";
    $("h_api").textContent = j.api.ok ? "ok · " + j.api.ms + " ms" : "无响应";
    $("h_api").className = "v " + (j.api.ok ? "ok" : "bad");
  } catch (e) {}
}

/* ---------- 启动参数（结构化表单） ---------- */
let cmdHist = [], cmdBinary = "", cmdCurrent = "";
const NUM_IDS = [["f_c","-c"],["f_ngl","-ngl"],["f_t","-t"],["f_np","-np"],
                 ["f_b","-b"],["f_ub","-ub"],["f_port","--port"],["f_dmax","--spec-draft-n-max"],
                 ["f_dngl","-ngld"],
                 ["f_cram","--cache-ram"],["f_temp","--temp"],["f_topk","--top-k"],
                 ["f_topp","--top-p"],["f_minp","--min-p"],["f_reasoning_budget","--reasoning-budget"],
                 ["f_repeat_penalty","--repeat-penalty"],["f_presence_penalty","--presence-penalty"],
                 ["f_frequency_penalty","--frequency-penalty"],["f_repeat_last_n","--repeat-last-n"],
                 ["f_seed","--seed"],
                 ["f_cache_reuse","--cache-reuse"],["f_threads_batch","--threads-batch"],
                 ["f_main_gpu","--main-gpu"],["f_n_cpu_moe","--n-cpu-moe"],["f_rope_scale","--rope-scale"],
                 ["f_threads_http","--threads-http"],["f_timeout","--timeout"],
                 ["f_sleep_idle_seconds","--sleep-idle-seconds"],
                 ["f_image_min_tokens","--image-min-tokens"],["f_image_max_tokens","--image-max-tokens"]];
const SEL_IDS = [["f_fa","-fa"],["f_split","--split-mode"],["f_ctk","-ctk"],["f_ctv","-ctv"],
                 ["f_dctk","-ctkd"],["f_dctv","-ctvd"],
                 ["f_load","--load-mode"],["f_reasoning","--reasoning"],
                 ["f_reasoning_effort","--reasoning-effort"],["f_reasoning_format","--reasoning-format"],
                 ["f_fit","--fit"],["f_numa","--numa"],["f_rope_scaling","--rope-scaling"]];
const SPEC_TYPES = ["none","draft-mtp","draft-simple","draft-eagle3","draft-dflash","draft-dspark",
                    "ngram-simple","ngram-map-k","ngram-map-k4v","ngram-mod","ngram-cache"];
const SPEC_NEED_DRAFT = ["draft-simple","draft-eagle3","draft-dflash","draft-dspark"];
// 互斥组：一个草稿文件只对应一种类型（draft-mtp 指定草稿文件时同理），五选一；ngram-* 可自由搭配
const SPEC_DRAFT_TYPES = ["draft-mtp", ...SPEC_NEED_DRAFT];
const specId = t => "f_spec_" + t.replace(/-/g, "_");
const CHK_IDS = [["f_metrics","--metrics"],["f_nohost","--no-host"],["f_nommo","--no-mmproj-offload"],
                 ["f_no_kv_offload","--no-kv-offload"],["f_context_shift","--context-shift"],
                 ["f_no_webui","--no-webui"]];
const TXT_IDS = [["f_alias","--alias"],["f_ts","--tensor-split"],
                 ["f_host","--host"],["f_kwargs","--chat-template-kwargs"],
                 ["f_fit_target","--fit-target"],
                 ["f_api_key","--api-key"]];

function buildCmd() {
  const v = id => $(id).value.trim();
  const parts = [];
  if (v("f_model")) parts.push("-m", v("f_model"));
  if (v("f_mmproj")) parts.push("--mmproj", v("f_mmproj"));
  if (v("f_draft") && !$("f_draft").disabled) parts.push("--model-draft", v("f_draft"));
  if (v("f_chat_template_file")) parts.push("--chat-template-file", v("f_chat_template_file"));
  for (const [id, p] of NUM_IDS) { const x = v(id); if (x && !$(id).disabled) parts.push(p, x); }
  for (const [id, p] of SEL_IDS) { const x = v(id); if (x && !$(id).disabled) parts.push(p, x); }
  const specActive = SPEC_TYPES.filter(t => t !== "none" && $(specId(t)).checked);
  if ($("f_spec_none").checked || specActive.length) {
    parts.push("--spec-type", $("f_spec_none").checked ? "none" : specActive.join(","));
  }
  const devActive = [...$("devchk").querySelectorAll("input:checked")].map(cb => cb.dataset.dev);
  if (devActive.length) parts.push("--device", devActive.join(","));
  for (const [id, txt] of CHK_IDS) if ($(id).checked && !$(id).disabled) parts.push(txt);
  for (const [id, p] of TXT_IDS) {
    let x = v(id);
    if (!x || $(id).disabled) continue;
    if (id === "f_kwargs" && x.includes("{") && !x.startsWith("'")) x = "'" + x + "'";
    if (id === "f_api_key" && x.includes(" ") && !x.startsWith("'")) x = "'" + x + "'";
    parts.push(p, x);
  }
  const custom = v("f_custom");
  if (custom) parts.push(custom);
  const bin = $("f_binary").value.trim();
  return (bin ? bin + " " : "") + parts.join(" ");
}

function tokenizeCmd(cmd) {
  const out = [];
  const re = /'[^']*'|"[^"]*"|\S+/g;
  let m;
  while ((m = re.exec(cmd))) out.push(m[0]);
  return out;
}

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve(ok);
}
function flashBtn(btn, ok) {
  const old = btn.textContent;
  btn.textContent = ok ? "已复制" : "失败";
  btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}

function updateSpecUI() {
  const active = SPEC_TYPES.filter(t => t !== "none" && $(specId(t)).checked);
  const none = $("f_spec_none").checked;
  const row = $("row_draft"), cell = $("cell_dmax"), hint = $("spec_hint");
  const needDraft = active.some(t => SPEC_NEED_DRAFT.includes(t));
  const hasMtp = active.includes("draft-mtp");
  const hasNgram = active.some(t => t.startsWith("ngram-"));
  const draftOn = needDraft || hasMtp;
  row.classList.toggle("disabled", !draftOn);
  row.querySelectorAll("input, button").forEach(el => { el.disabled = !draftOn; });
  document.querySelectorAll(".draft-only").forEach(el => {
    el.classList.toggle("disabled", !draftOn);
    el.querySelectorAll("input, select").forEach(i => { i.disabled = !draftOn; });
  });
  $("f_dmax").disabled = active.length === 0;
  cell.classList.toggle("disabled", active.length === 0);
  if (needDraft && !$("f_draft").value) {
    hint.textContent = "⚠ 当前类型需要指定草稿模型文件（--model-draft）";
    hint.className = "fhint warn";
  } else if (active.length > 1) {
    hint.textContent = "多选为回退链：每个草稿步按列表顺序取第一个能产出草稿的类型生效";
    hint.className = "fhint";
  } else if (needDraft) {
    hint.textContent = "当前类型使用指定的草稿模型";
    hint.className = "fhint";
  } else if (hasMtp) {
    hint.textContent = "MTP 默认使用主模型内置 MTP 模块；若指定草稿模型则会改加载该文件";
    hint.className = "fhint";
  } else if (hasNgram) {
    hint.textContent = "n-gram 方式不需要草稿模型";
    hint.className = "fhint";
  } else {
    hint.textContent = none ? "投机解码已禁用（none）" : "未启用投机解码";
    hint.className = "fhint";
  }
}

function updateMultiGPUUI() {
  const n = [...$("devchk").querySelectorAll("input:checked")].length;
  const splitCell = $("cell_split"), tsCell = $("cell_ts"), hint = $("gpu_hint");
  const multi = n >= 2;
  splitCell.classList.toggle("disabled", !multi);
  $("f_split").disabled = !multi;
  tsCell.classList.toggle("disabled", !multi);
  $("f_ts").disabled = !multi;
  if (n === 0) {
    hint.textContent = "未选择 GPU 设备";
    hint.className = "fhint";
  } else if (n === 1) {
    hint.textContent = "单设备：无需设置切分模式与 tensor-split";
    hint.className = "fhint";
  } else {
    const raw = $("f_ts").value.trim();
    const m = raw ? raw.split(",").map(s => s.trim()).filter(Boolean).length : 0;
    if (m === 0) {
      hint.textContent = "已选 " + n + " 个设备 · 未设置 tensor-split（默认均分）";
      hint.className = "fhint";
    } else if (m === n) {
      hint.textContent = "已选 " + n + " 个设备 · tensor-split " + n + " 个比例 ✓";
      hint.className = "fhint";
    } else {
      hint.textContent = "⚠ 已选 " + n + " 个设备，tensor-split 需 " + n + " 个比例（当前 " + m + " 个）";
      hint.className = "fhint warn";
    }
  }
}

function updateMmUI() {
  const hasMm = !!$("f_mmproj").value.trim();
  $("row_nommo").classList.toggle("disabled", !hasMm);
  $("f_nommo").disabled = !hasMm;
}

function updateBatchUI() {
  const hint = $("batch_hint");
  const b = $("f_b").value.trim(), ub = $("f_ub").value.trim();
  if (b && ub && +ub > +b) {
    hint.textContent = "⚠ 微批(-ub " + ub + ") 大于批(-b " + b + ")，通常 -ub ≤ -b";
    hint.className = "fhint warn";
  } else {
    hint.textContent = "";
    hint.className = "fhint";
  }
}

function updatePreview() {
  hideCmdDiff();
  updateSpecUI();
  updateMultiGPUUI();
  updateMmUI();
  updateBatchUI();
  const el = $("cmd_preview"), note = $("cmd_diff_note");
  const newCmd = buildCmd();
  if (!newCmd) { el.textContent = "（空）"; note.style.display = "none"; return; }
  const cur = cmdCurrent ? tokenizeCmd(cmdCurrent) : [];
  const nw = tokenizeCmd(newCmd);
  const curSet = new Set(cur), nwSet = new Set(nw);
  let html = "", added = 0, removed = 0;
  for (const t of nw) {
    if (cur.length && !curSet.has(t)) { html += '<span class="tok-add">' + escHtml(t) + "</span> "; added++; }
    else html += escHtml(t) + " ";
  }
  for (const t of cur) {
    if (!nwSet.has(t)) { html += '<span class="tok-del">' + escHtml(t) + "</span> "; removed++; }
  }
  el.innerHTML = html.trim();
  if (added || removed) {
    note.style.display = "";
    note.textContent = "与当前命令的差异：新增 " + added + " 项 · 移除 " + removed + " 项";
  } else {
    note.style.display = "none";
  }
}

function hideCmdDiff() { const b = $("cmd_diff"); if (b) b.style.display = "none"; }
async function showCmdDiff(cmd) {
  const box = $("cmd_diff");
  try {
    const j = await api("/api/admin/cmd/diff?cmd=" + encodeURIComponent(cmd));
    const diffs = j.diffs || [];
    const fmt = x => x === true ? "开" : (x === false ? "关" : (x || "—"));
    let html = '<div class="cmd-diff-title">' +
      (diffs.length ? "与当前命令的差异（" + diffs.length + " 项）" : "与当前命令一致（无差异）") + "</div>";
    for (const d of diffs) {
      html += '<div class="cmd-diff-row"><span class="cmd-diff-flag">' + escHtml(d.flag) + "</span>"
            + '<span class="cmd-diff-cur">' + escHtml(fmt(d.cur)) + "</span>"
            + '<span class="cmd-diff-arrow">→</span>'
            + '<span class="cmd-diff-new">' + escHtml(fmt(d.new)) + "</span></div>";
    }
    box.innerHTML = html;
    box.style.display = "";
  } catch (e) { box.style.display = "none"; }
}

function fillForm(p) {
  $("f_model").value = p.model || "";
  $("f_mmproj").value = p.mmproj || "";
  $("f_draft").value = p.draft || "";
  $("f_chat_template_file").value = p.chat_template_file || "";
  for (const [id, key] of [["f_c","c"],["f_ngl","ngl"],["f_t","t"],["f_np","np"],
                           ["f_b","b"],["f_ub","ub"],["f_port","port"],["f_dmax","draft_n_max"],
                           ["f_dngl","draft_ngl"],
                           ["f_cram","cache_ram"],["f_temp","temp"],["f_topk","top_k"],
                           ["f_topp","top_p"],["f_minp","min_p"],["f_reasoning_budget","reasoning_budget"],
                           ["f_repeat_penalty","repeat_penalty"],["f_presence_penalty","presence_penalty"],
                           ["f_frequency_penalty","frequency_penalty"],["f_repeat_last_n","repeat_last_n"],
                           ["f_seed","seed"],
                           ["f_cache_reuse","cache_reuse"],["f_threads_batch","threads_batch"],
                           ["f_main_gpu","main_gpu"],["f_n_cpu_moe","n_cpu_moe"],["f_rope_scale","rope_scale"],
                           ["f_threads_http","threads_http"],["f_timeout","timeout"],
                           ["f_sleep_idle_seconds","sleep_idle_seconds"],
                           ["f_image_min_tokens","image_min_tokens"],["f_image_max_tokens","image_max_tokens"]])
    $(id).value = p[key] || "";
  for (const [id, key] of [["f_fa","fa"],["f_split","split"],["f_ctk","ctk"],["f_ctv","ctv"],
                           ["f_dctk","draft_ctk"],["f_dctv","draft_ctv"],
                           ["f_load","load_mode"],["f_reasoning","reasoning"],
                           ["f_reasoning_effort","reasoning_effort"],["f_reasoning_format","reasoning_format"],
                           ["f_fit","fit"],["f_numa","numa"],["f_rope_scaling","rope_scaling"]]) {
    const x = p[key] || "";
    $(id).value = [...$(id).options].some(o => o.value === x) ? x : "";
  }
  SPEC_TYPES.forEach(t => { $(specId(t)).checked = false; });
  const st = (p.spec_type || "").split(",").map(s => s.trim()).filter(s => SPEC_TYPES.includes(s));
  if (st.includes("none")) st.length = 0;
  st.forEach(t => { $(specId(t)).checked = true; });
  // 旧命令可能含互斥组内的多个类型，归一为第一个（SPEC_TYPES 顺序）
  SPEC_DRAFT_TYPES.filter(t => $(specId(t)).checked).slice(1)
    .forEach(t => { $(specId(t)).checked = false; });
  for (const [id, key] of [["f_metrics","metrics"],["f_nohost","no_host"],["f_nommo","no_mmproj_offload"],
                           ["f_no_kv_offload","no_kv_offload"],["f_context_shift","context_shift"],
                           ["f_no_webui","no_webui"]])
    $(id).checked = !!p[key];
  for (const [id, key] of [["f_alias","alias"],["f_ts","tensor_split"],
                           ["f_host","host"],["f_kwargs","chat_kwargs"],
                           ["f_fit_target","fit_target"],
                           ["f_api_key","api_key"]])
    $(id).value = p[key] || "";
  const devSet = new Set((p.device || "").split(",").map(s => s.trim()).filter(Boolean));
  [...$("devchk").querySelectorAll("input")].forEach(cb => { cb.checked = devSet.has(cb.dataset.dev); });
  $("f_custom").value = p.custom || "";
  updatePreview();
}

async function loadCmd() {
  if (!token) return;
  await loadDevices();
  try {
    const j = await api("/api/admin/cmd");
    cmdBinary = (j.parsed && j.parsed.binary) || "";
    $("f_binary").value = cmdBinary;
    cmdCurrent = j.current || "";
    cmdHist = j.history || [];
    if (j.parsed) fillForm(j.parsed);
    renderHist();
  } catch (e) {}
}
function renderHist() {
  const box = $("hist_list");
  if (!box) return;
  if (!cmdHist.length) { box.innerHTML = '<div class="hist-empty">暂无历史记录</div>'; return; }
  let html = "";
  cmdHist.forEach((h, i) => {
    const d = new Date(h.ts * 1000).toLocaleString("zh-CN");
    const isCur = (i === 0);
    const name = h.name || (h.cmd ? h.cmd.slice(0, 40) : "（未命名）");
    const diff = h.diff || "";
    html += '<div class="hist-item' + (isCur ? " cur" : "") + '" data-i="' + i + '">'
      + '<div class="hist-main">'
      + '<div class="hist-name">' + escHtml(name) + '</div>'
      + (diff ? '<div class="hist-diff">差异：' + escHtml(diff) + '</div>' : "")
      + '<div class="hist-meta">' + (isCur ? "当前 · " : "") + escHtml(d) + '</div>'
      + '</div>'
      + '<div class="hist-acts">'
      + (isCur ? "" : '<button class="btn sm" data-act="load">加载</button>'
        + '<button class="btn sm" data-act="rename">改名</button>'
        + '<button class="btn sm danger" data-act="del">删除</button>')
      + '</div></div>';
  });
  box.innerHTML = html;
}

async function saveCmd(restart) {
  const label = restart ? "保存并重启" : "保存";
  if (restart && !confirm("保存后将重启 llama-server，确定继续？")) return;
  $("cmd_msg").textContent = label + "中…";
  try {
    const j = await api("/api/admin/cmd", { cmd: buildCmd(), restart });
    if (!j.ok) { $("cmd_msg").textContent = j.error; $("cmd_msg").className = "msg bad"; return; }
    $("cmd_msg").textContent = j.changed ? label + "成功" : "命令未变化";
    $("cmd_msg").className = "msg ok";
    loadCmd();
    refreshService();
  } catch (e) { $("cmd_msg").textContent = e.message; $("cmd_msg").className = "msg bad"; }
}
$("hist_list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const item = btn.closest(".hist-item");
  const h = cmdHist[+item.dataset.i];
  if (!h) return;
  const act = btn.dataset.act;
  if (act === "load") { fillFromRaw(h.cmd); showCmdDiff(h.cmd); }
  else if (act === "rename") { renameHistItem(h); }
  else if (act === "del") { deleteHistItem(h); }
});
async function renameHistItem(h) {
  const name = prompt("输入新名称", h.name || "");
  if (name === null) return;
  const nm = name.trim();
  if (!nm) { alert("名称不能为空"); return; }
  try {
    const j = await api("/api/admin/cmd/hist/rename", { cmd: h.cmd, name: nm });
    if (!j.ok) { alert(j.error || "改名失败"); return; }
    cmdHist = j.history || [];
    renderHist();
  } catch (e) { alert(e.message); }
}
async function deleteHistItem(h) {
  if (!confirm("确定删除该历史记录？\n" + (h.name || h.cmd.slice(0, 60)))) return;
  try {
    const j = await api("/api/admin/cmd/hist/delete", { cmd: h.cmd });
    if (!j.ok) { alert(j.error || "删除失败"); return; }
    cmdHist = j.history || [];
    renderHist();
  } catch (e) { alert(e.message); }
}
function fillFromRaw(cmd) {
  // 前端粗解析：只用于历史回填，精确解析以后端为准
  const m = cmd.match(/(\S+)\s/);
  cmdBinary = m ? m[1] : "";
  $("f_binary").value = cmdBinary;
  const p = { model: "", mmproj: "", draft: "", c: "", ngl: "", t: "", np: "", b: "", ub: "",
              port: "", draft_n_max: "", draft_ngl: "", cache_ram: "", temp: "", top_k: "", top_p: "", min_p: "",
              reasoning_budget: "", reasoning_effort: "", reasoning_format: "",
              repeat_penalty: "", presence_penalty: "", frequency_penalty: "", repeat_last_n: "", seed: "",
              cache_reuse: "", threads_batch: "", main_gpu: "", n_cpu_moe: "", fit: "", fit_target: "",
              numa: "", rope_scaling: "", rope_scale: "",
              threads_http: "", timeout: "", sleep_idle_seconds: "", api_key: "",
              image_min_tokens: "", image_max_tokens: "",
              fa: "", split: "", ctk: "", ctv: "", draft_ctk: "", draft_ctv: "", load_mode: "", spec_type: "", reasoning: "",
              alias: "", device: "", tensor_split: "", host: "", chat_kwargs: "", chat_template_file: "",
              metrics: false, no_host: false, no_mmproj_offload: false, no_kv_offload: false,
              context_shift: false, no_webui: false, custom: "" };
  let rest = cmd.replace(cmdBinary, "");
  const grab = (pat, key) => {
    const mm = rest.match(pat);
    if (mm) { p[key] = mm[1]; rest = rest.replace(mm[0], " "); }
  };
  grab(/(?:^|\s)-m\s+(\S+)/, "model");
  grab(/(?:^|\s)--mmproj\s+(\S+)/, "mmproj");
  grab(/(?:^|\s)(?:--spec-draft-model|--model-draft|-md)\s+(\S+)/, "draft");
  grab(/(?:^|\s)-c\s+(\S+)/, "c");
  grab(/(?:^|\s)-ngl\s+(\S+)/, "ngl");
  grab(/(?:^|\s)-ngld\s+(\S+)/, "draft_ngl");
  grab(/(?:^|\s)-t\s+(\S+)/, "t");
  grab(/(?:^|\s)-np\s+(\S+)/, "np");
  grab(/(?:^|\s)-b\s+(\S+)/, "b");
  grab(/(?:^|\s)-ub\s+(\S+)/, "ub");
  grab(/(?:^|\s)--port\s+(\S+)/, "port");
  grab(/(?:^|\s)--spec-draft-n-max\s+(\S+)/, "draft_n_max");
  grab(/(?:^|\s)--cache-ram\s+(\S+)/, "cache_ram");
  grab(/(?:^|\s)--temp\s+(\S+)/, "temp");
  grab(/(?:^|\s)--top-k\s+(\S+)/, "top_k");
  grab(/(?:^|\s)--top-p\s+(\S+)/, "top_p");
  grab(/(?:^|\s)--min-p\s+(\S+)/, "min_p");
  grab(/(?:^|\s)--repeat-penalty\s+(\S+)/, "repeat_penalty");
  grab(/(?:^|\s)--presence-penalty\s+(\S+)/, "presence_penalty");
  grab(/(?:^|\s)--frequency-penalty\s+(\S+)/, "frequency_penalty");
  grab(/(?:^|\s)--repeat-last-n\s+(\S+)/, "repeat_last_n");
  grab(/(?:^|\s)--seed\s+(\S+)/, "seed");
  grab(/(?:^|\s)--cache-reuse\s+(\S+)/, "cache_reuse");
  grab(/(?:^|\s)--threads-batch\s+(\S+)/, "threads_batch");
  grab(/(?:^|\s)--main-gpu\s+(\S+)/, "main_gpu");
  grab(/(?:^|\s)--n-cpu-moe\s+(\S+)/, "n_cpu_moe");
  grab(/(?:^|\s)--fit\s+(\S+)/, "fit");
  grab(/(?:^|\s)--fit-target\s+(\S+)/, "fit_target");
  grab(/(?:^|\s)--numa\s+(\S+)/, "numa");
  grab(/(?:^|\s)--rope-scaling\s+(\S+)/, "rope_scaling");
  grab(/(?:^|\s)--rope-scale\s+(\S+)/, "rope_scale");
  grab(/(?:^|\s)--threads-http\s+(\S+)/, "threads_http");
  grab(/(?:^|\s)--timeout\s+(\S+)/, "timeout");
  grab(/(?:^|\s)--sleep-idle-seconds\s+(\S+)/, "sleep_idle_seconds");
  grab(/(?:^|\s)--image-min-tokens\s+(\S+)/, "image_min_tokens");
  grab(/(?:^|\s)--image-max-tokens\s+(\S+)/, "image_max_tokens");
  grab(/(?:^|\s)--api-key\s+('(?:[^']*)'|\S+)/, "api_key");
  grab(/(?:^|\s)-fa\s+(\S+)/, "fa");
  grab(/(?:^|\s)--split-mode\s+(\S+)/, "split");
  grab(/(?:^|\s)-ctk\s+(\S+)/, "ctk");
  grab(/(?:^|\s)-ctv\s+(\S+)/, "ctv");
  grab(/(?:^|\s)-ctkd\s+(\S+)/, "draft_ctk");
  grab(/(?:^|\s)-ctvd\s+(\S+)/, "draft_ctv");
  grab(/(?:^|\s)--load-mode\s+(\S+)/, "load_mode");
  grab(/(?:^|\s)--spec-type\s+(\S+)/, "spec_type");
  grab(/(?:^|\s)--reasoning\s+(\S+)/, "reasoning");
  grab(/(?:^|\s)--reasoning-budget\s+(\S+)/, "reasoning_budget");
  grab(/(?:^|\s)--reasoning-effort\s+(\S+)/, "reasoning_effort");
  grab(/(?:^|\s)--reasoning-format\s+(\S+)/, "reasoning_format");
  grab(/(?:^|\s)--alias\s+(\S+)/, "alias");
  grab(/(?:^|\s)--device\s+(\S+)/, "device");
  grab(/(?:^|\s)--tensor-split\s+(\S+)/, "tensor_split");
  grab(/(?:^|\s)--host\s+(\S+)/, "host");
  grab(/(?:^|\s)--chat-template-kwargs\s+(\S+)/, "chat_kwargs");
  grab(/(?:^|\s)--chat-template-file\s+(\S+)/, "chat_template_file");
  p.metrics = /(?:^|\s)--metrics(?=\s|$)/.test(rest);
  p.no_host = /(?:^|\s)--no-host(?=\s|$)/.test(rest);
  p.no_mmproj_offload = /(?:^|\s)--no-mmproj-offload(?=\s|$)/.test(rest);
  p.no_kv_offload = /(?:^|\s)--no-kv-offload(?=\s|$)/.test(rest);
  p.context_shift = /(?:^|\s)--context-shift(?=\s|$)/.test(rest);
  p.no_webui = /(?:^|\s)--no-webui(?=\s|$)/.test(rest);
  p.custom = rest.split().join(" ");
  fillForm(p);
}

async function loadDir(path) {
  $("fm_path").textContent = path;
  $("fm_list").innerHTML = "加载中…";
  try {
    const j = await api("/api/admin/files?path=" + encodeURIComponent(path));
    const list = $("fm_list");
    list.innerHTML = "";
    if (j.parent) {
      const a = document.createElement("div");
      a.className = "fm-item dir";
      a.textContent = "⬆ 上级目录";
      a.onclick = () => loadDir(j.parent);
      list.appendChild(a);
    }
    (j.dirs || []).forEach(d => {
      const el = document.createElement("div");
      el.className = "fm-item dir";
      el.textContent = "📁 " + d;

      list.appendChild(el);
    });
    (j.files || []).forEach(f => {
      const el = document.createElement("div");
      el.className = "fm-item";

        $("file_modal").style.display = "none";

  }
}

/* ---------- 快速测试 ---------- */
$("btn_test").onclick = async () => {
  $("test_status").textContent = "生成中…";
  $("test_out").textContent = "";
  const t0 = Date.now();
  try {
    const j = await api("/api/admin/test", {
      prompt: $("test_prompt").value, n_predict: +$("test_max").value || 64 });
    if (!j.ok) { $("test_status").textContent = j.error; $("test_status").className = "msg bad"; return; }
    const wall = (Date.now() - t0) / 1000;
    let mtpStr = "";
    if (j.mtp && j.mtp.draft_tokens > 0) {
      mtpStr = " · MTP 接受率 " + j.mtp.accept + "%（" + j.mtp.accepted + "/" + j.mtp.draft_tokens + "）";
    }
    $("test_status").textContent =
      "完成 · " + (j.timing.predicted_n || 0) + " tok · " +
      (j.timing.predicted_per_second ? j.timing.predicted_per_second.toFixed(1) : "—") +
      " t/s（服务端计时）· 端到端 " + wall.toFixed(1) + " s" + mtpStr;
    $("test_status").className = "msg ok";
    $("test_out").textContent = j.content || "";
  } catch (e) { $("test_status").textContent = e.message; $("test_status").className = "msg bad"; }
};

/* ---------- 日志 ---------- */
const MAXLINES = 800;
function addLine(view, line, max, filter) {
  if (filter) {
    const f = filter.toLowerCase();
    if (f && !line.toLowerCase().includes(f)) return;
  }
  const d = document.createElement("div");
  d.className = "ll" + (/\.\d{3} E /.test(line) ? " bad" : /\.\d{3} W /.test(line) ? " warn" : "");
  d.textContent = line;
  view.appendChild(d);
  while (view.children.length > max) view.removeChild(view.firstChild);
}

function loadTail() {
  const prio = $("log_prio").value;
  api("/api/admin/logs?n=100&prio=" + prio).then(j => {
    const v = $("log_view");
    const f = $("log_filter").value.trim();
    v.innerHTML = "";
    (j.lines || []).forEach(l => addLine(v, l, MAXLINES, f));
    v.scrollTop = v.scrollHeight;
  }).catch(() => {});
}

function openStream() {
  if (es) { es.close(); es = null; }
  if (!$("log_follow").checked) { $("log_state").textContent = "（已暂停跟随）"; return; }
  $("log_state").textContent = "";
  es = new EventSource("/api/admin/logs/stream?token=" + encodeURIComponent(token) +
                       "&prio=" + $("log_prio").value);
  es.onmessage = e => {
    const v = $("log_view");
    const pin = v.scrollHeight - v.scrollTop - v.clientHeight < 40;
    addLine(v, e.data, MAXLINES, $("log_filter").value.trim());
    if (pin) v.scrollTop = v.scrollHeight;
  };
  es.onerror = () => { $("log_state").textContent = "（连接断开，自动重连中…）"; };
}

let filterTimer = null;
$("log_filter").oninput = () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(loadTail, 300);
};
$("log_follow").onchange = openStream;
$("log_prio").onchange = () => { loadTail(); openStream(); };
$("btn_log_refresh").onclick = loadTail;
$("btn_log_clear").onclick = () => { $("log_view").innerHTML = ""; };
$("btn_log_copy").onclick = () => {
  const t = [...$("log_view").children].map(c => c.textContent).join("\n");
  if (!t) { flashBtn($("btn_log_copy"), false); return; }

};

           "&n=2000&prio=" + $("log_prio").value;
